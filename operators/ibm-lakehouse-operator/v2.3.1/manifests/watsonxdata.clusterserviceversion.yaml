  description: "IBM&reg; watsonx.data is a new open architecture that combines the\
    \ elements of the data warehouse and data lake models. The best-in-class features\
    \ and optimizations available on the watsonx.data make it an optimal choice for\
    \ next generation data analytics and automation.\n\n# Name\nIBM&reg; IBM watsonx.data\n\
    \n# Details\nwatsonx.data is a unique solution that allows co-existence of open\
    \ source technologies and proprietary products.\nIt offers a single platform where\
    \ you can store the data or attach data sources for managing and analyzing your\
    \ enterprise data.\nUse watsonx.data to store any type of data (structured, semi-structured,\
    \ and unstructured) and\nmake that data accessible directly for Artificial Intelligence\
    \ (AI) and Business Intelligence (BI).\nYou can also attach your data sources\
    \ to watsonx.data, which helps to reduce data duplication and cost of storing\
    \ data in multiple places.\nIt uses open data formats with APIs and machine learning\
    \ libraries, making it easier for data scientists and data engineers to use the\
    \ data.\nwatsonx.data architecture enforces schema and data integrity, making\
    \ it easier to implement robust data security and governance mechanisms.\n\n##\
    \ Prerequisites\n1. To install watsonx.data, you must have a client workstation\
    \ that can connect to the Red Hat&reg; OpenShift&reg; Container Platform cluster.\n\
    2. To be able to run ib-lh-manage commands in a restricting environment\n3. Set\
    \ up persistent storage\n4. Set up project on Red Hat&reg; OpenShift&reg; Container\
    \ Platform cluster.\n5. Update global image pull secret\n6. Mirror image to a\
    \ private container registry\n\n## Resources Required\n\nVarious Resources Required\n\
    \n## Installing\nFor instructions to install IBM&reg; watsonx.data 2.3.1 patch\
    \ 2, contact your local sales representative.\nOne of our technical team members\
    \ will guide you through the installation process.\n\n## Configuration\n  N/A\n\
    ### Limitations\n1. When dealing with character data, case sensitivity can be\
    \ important when searching for specific matches or patterns.\nHowever, not all\
    \ databases and query engines behave in the same way.\nSome are case insensitive\
    \ by default, while others are not.\nThis can lead to unexpected results if the\
    \ case of the data is not taken into account.\n\n### SecurityContextConstraints\
    \ Requirements\nIBM&reg; watsonx.data supports several different mechanisms for\
    \ securing your environment and your data.\nFIPS can also be enabled.\n"
